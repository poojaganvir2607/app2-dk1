apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: nginx
        image: public.ecr.aws/m8b8m3k4/myapp:BUILD_NUMBER
        imagePullPolicy: Always
        ports:
        - containerPort: 80



