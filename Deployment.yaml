apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: nginx
        image: 747409585857.dkr.ecr.us-east-1.amazonaws.com/myapp:BUILD_NUMBER
        imagePullPolicy: Always
        ports:
        - containerPort: 80



